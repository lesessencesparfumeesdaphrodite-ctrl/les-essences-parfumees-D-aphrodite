<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3D2B2E">
<title>Espace administrateur — Les Essences Parfumées d'Aphrodite</title>
<link rel="manifest" href="manifest-app.json">
<link rel="icon" href="favicon-48.png">
<link rel="apple-touch-icon" href="icone-bon-180.png">
<style>
:root{--creme:#FFFDF9;--sable:#F5EDE4;--brun:#2C1810;--terra:#9E5238;--or:#C9A96E;--gris:#6B5E55;--bord:#3D2B2E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--creme);color:var(--brun);font-family:'Lato','Segoe UI',Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;cursor:pointer}
.barre{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bord);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
.barre img{width:34px;height:34px;border-radius:50%;background:#fff}
.barre h1{font-size:16px;margin:0;flex:1;font-weight:700}
.barre button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:6px 14px;font-size:14px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.accueil{padding:18px 14px 30px;max-width:640px;width:100%;margin:0 auto}
.accueil p.bj{margin:0 0 14px;font-size:15px;color:var(--gris);text-align:center}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tuile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;padding:14px 10px;background:var(--sable);border:1.5px solid rgba(201,169,110,.55);border-radius:22px;color:var(--brun);text-align:center;font-weight:700;font-size:16px}
.tuile .e{font-size:34px;line-height:1}
.tuile small{font-weight:400;font-size:12.5px;color:var(--gris)}
.tuile:active{background:#ecdfd0}
.tuile:focus-visible,.barre button:focus-visible,.btn:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.cadre{flex:1;border:0;width:100%;min-height:0;background:var(--creme)}
.vue{display:none;flex:1;min-height:0;flex-direction:column}
.vue.on{display:flex}
/* verrou */
#verrou{position:fixed;inset:0;background:var(--creme);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#verrou.cache{display:none}
.carte-v{width:100%;max-width:360px;text-align:center}
.carte-v img{width:120px;height:120px;border-radius:50%}
.carte-v h2{margin:10px 0 4px;font-size:20px}
.carte-v input{width:100%;padding:13px;border:1.5px solid rgba(201,169,110,.7);border-radius:14px;font-size:16px;margin:12px 0 8px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-weight:700;font-size:15px}
.carte-v .btn{width:100%}
#msgv{min-height:20px;font-size:14px;color:#a3301f;margin:6px 0 0}
/* commandes */
.liste{padding:14px;max-width:760px;width:100%;margin:0 auto;overflow:auto}
.titre-g{text-align:center;font-size:19px;margin:6px 0 12px}
.boite{background:#fff;border:1.5px solid rgba(201,169,110,.55);border-radius:20px;padding:14px;margin-bottom:16px}
.boite h3{margin:0 0 6px;font-size:17px}
.cmd{padding:12px 0;border-top:1px solid rgba(201,169,110,.3)}
.cmd .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cmd .t strong{font-size:14.5px}.cmd .t span{color:var(--terra);font-weight:700}
.cmd .s{font-size:13px;margin:3px 0}
.cmd .p{font-size:12.5px;color:var(--gris);white-space:pre-line;line-height:1.55}
.champs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.champs>div{flex:1;min-width:150px}
.champs label{display:block;font-size:12.5px;font-weight:700;margin:6px 0 4px}
.champs input,.champs select{width:100%;padding:11px;border:1.5px solid rgba(201,169,110,.7);border-radius:12px;font-size:15px;background:#fff}
.petit{background:var(--terra);color:#fff;border:0;border-radius:20px;padding:9px 20px;font-weight:700;font-size:13.5px;margin-top:10px}
.sec{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.msg{font-size:13.5px;color:#2a6a5a;margin:6px 0}
.vide{font-size:13.5px;color:var(--gris)}

/* ---- nouveau décor ---- */
body{background:linear-gradient(180deg,#FFEDD9 0%,#FFFDF9 38%)}
#verrou{background:radial-gradient(circle at 20% 15%,#f6d9c3 0,transparent 45%),radial-gradient(circle at 85% 80%,#ecd3a8 0,transparent 42%),linear-gradient(160deg,#FFEDD9,#FFFDF9)}
.carte-v{background:rgba(255,255,255,.75);border:1.5px solid rgba(201,169,110,.6);border-radius:28px;padding:26px 22px;box-shadow:0 10px 30px rgba(158,82,56,.15)}
.carte-v img{border:3px solid var(--or);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.carte-v h2{font-family:Georgia,'Times New Roman',serif;font-size:26px;color:var(--terra);letter-spacing:.5px}
.carte-v .slogan{font-size:13px;color:var(--gris);margin:0 0 6px;letter-spacing:1.5px}
.bj2{font-family:Georgia,serif;font-size:22px;text-align:center;color:var(--terra);margin:2px 0 2px}
.accueil{max-width:720px}
.grandes{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.grande{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border:0;border-radius:24px;color:#fff;box-shadow:0 6px 16px rgba(61,43,46,.2)}
.grande .e{font-size:40px}
.grande b{display:block;font-size:19px;font-family:Georgia,serif}
.grande small{font-size:13px;opacity:.92}
.g1{background:linear-gradient(135deg,#9E5238,#c98467)}
.g2{background:linear-gradient(135deg,#6b3a52,#b97a95)}
.tuiles{grid-template-columns:repeat(3,1fr);gap:10px}
.tuile{min-height:104px;border-radius:20px;font-size:13.5px;padding:10px 6px;text-align:center}
.tuile .e{font-size:28px}
.tuile small{font-size:11px;line-height:1.25}
.tuile.k1{background:#FBE3EA;border-color:#e9a9bd}.tuile.k2{background:#E3EEFB;border-color:#a9c6e9}.tuile.k3{background:#E4F3DF;border-color:#a8d29b}.tuile.k4{background:#F1E6FA;border-color:#c5a8e0}.tuile.k5{background:#FFF1CC;border-color:#e6cd7e}
@media(min-width:560px){.grandes{grid-template-columns:1fr 1fr}}
/* ---- listes ---- */
.recherche{width:100%;padding:13px;border:1.5px solid rgba(201,169,110,.7);border-radius:14px;font-size:16px;margin:4px 0 8px;background:#fff}
.maj{font-size:12px;color:var(--gris);text-align:center;margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;justify-content:center}
.chip{border:1.5px solid rgba(201,169,110,.7);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;color:var(--brun)}
.chip.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.lettre{position:sticky;top:0;background:var(--sable);font-weight:700;color:var(--terra);padding:3px 10px;border-radius:8px;margin:10px 0 4px;font-size:14px;z-index:1}
.rang{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;margin:4px 0;border:1px solid rgba(0,0,0,.08);border-left:6px solid #ccc;border-radius:12px;background:#fff}
.rn{font-weight:700;font-size:15px;color:var(--brun)}.rs{font-size:12.5px;color:var(--gris)}
.t-femme{--tc:#D98BA7;--tb:#FCEBF1}.t-homme{--tc:#7FA6D9;--tb:#E9F1FB}.t-societe{--tc:#7FB070;--tb:#E9F5E5}.t-famille{--tc:#A98BD6;--tb:#F1EAFA}
.rang[class*="t-"]{border-left-color:var(--tc);background:var(--tb)}
.chip[class*="t-"]{border-color:var(--tc)}.chip[class*="t-"].on{background:var(--tc);border-color:var(--tc)}
.fiche{border-radius:20px;padding:14px;margin:10px 0;background:var(--tb);border:1.5px solid var(--tc)}
.fh h2{margin:4px 0 0;font-size:21px;font-family:Georgia,serif}.fh small{color:var(--gris)}
.tag{display:inline-block;background:var(--tc);color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.fl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(0,0,0,.07);font-size:14px}.fl span{color:var(--gris)}.fl b{font-weight:600;text-align:right;word-break:break-word}
.rem{margin-top:8px;font-size:13.5px;white-space:pre-line;background:#fff;border-radius:10px;padding:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn-l{background:#fff;border:1.5px solid var(--terra);color:var(--terra);border-radius:20px;padding:8px 14px;font-weight:700;font-size:13.5px;text-decoration:none}
.bon{padding:6px 0;font-size:13.5px;border-top:1px solid rgba(201,169,110,.3)}
.hab{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid rgba(201,169,110,.25);font-size:14px}
.boite.t-famille{background:var(--tb)}
.tache{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(201,169,110,.3)}
.tache.fait .tn{text-decoration:line-through;color:var(--gris)}
.tn{font-size:14.5px}.ts{font-size:12.5px;color:var(--gris)}.ts.retard{color:#a3301f;font-weight:700}
.coche{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--terra);background:#fff;color:#fff;font-size:18px;font-weight:700}
.coche.on{background:var(--terra)}
.mini{flex:none;border:1.5px solid var(--terra);background:#fff;color:var(--terra);border-radius:14px;padding:6px 10px;font-size:12.5px;font-weight:700;text-decoration:none}
.sect{font-size:15px;color:var(--terra);margin:14px 0 2px;font-family:Georgia,serif}
.jour{flex:none;width:48px;height:48px;border-radius:14px;background:var(--sable);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.jour small{font-size:10px;font-weight:400;text-transform:uppercase}.jour.auj{background:#FFF1CC;font-size:26px}
.tab .th,.tab .tr{display:grid;grid-template-columns:3fr 1fr 1.3fr 1.3fr;gap:6px;padding:6px 0;border-top:1px solid rgba(201,169,110,.25);font-size:13px}
.tab .c6{grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1fr;font-size:11.5px}.tab .c5{grid-template-columns:1.6fr 1fr 1fr 1fr 1.3fr}
.tab .th{font-weight:700;color:var(--terra);border-top:0}.tab .tr span+span,.tab .th span+span{text-align:right}.tab .tot{font-weight:700;background:var(--sable)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;max-width:640px;margin:0 auto;width:100%}
.hub .tuile{min-height:120px;font-size:15px}

/* ---- v2 sobre ---- */
body{background:#FFFDF9}
.hdr{text-align:center;margin:4px 0 14px}.hdate{margin:0;font-family:Georgia,serif;font-size:19px;color:var(--bord);text-transform:capitalize}.hmeteo{margin:4px 0 0;font-size:13.5px;color:var(--gris)}
.nvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nv{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;background:#fff;border:1px solid rgba(201,169,110,.7);border-left:4px solid var(--terra);border-radius:12px;color:var(--brun);font-weight:700;font-size:14.5px;min-height:64px}
.nv svg{flex:none;color:var(--terra)}.nv:active{background:var(--sable)}
.activites{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{border:0;border-radius:12px;padding:18px 14px;text-align:left;color:#fff;min-height:92px}
.act b{display:block;font-family:Georgia,serif;font-size:17px;margin-bottom:4px}.act small{font-size:12.5px;opacity:.9}
.a1{background:linear-gradient(135deg,#3D2B2E,#7a4a3a)}.a2{background:linear-gradient(135deg,#3D2B2E,#6b3a52)}
.hub{grid-template-columns:1fr;max-width:520px}
@media(max-width:380px){.nvs,.activites{grid-template-columns:1fr}}
/* commandes en lignes */
.cmd2{border-top:1px solid rgba(201,169,110,.35)}
.lg{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:12px 2px;text-align:left;color:var(--brun);font-size:14px}
.lg .lt b{font-size:14.5px}.lg .lt small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}
.lg .fl2{color:var(--terra);font-size:13px;flex:none}
.corps[hidden]{display:none}.corps{padding-bottom:10px}
.jour.fil{background:#FFE9A8}.jour.cli{background:#FBE3EA}
.stat{display:inline-block;font-size:11.5px;border-radius:10px;padding:1px 8px;background:var(--sable);margin-left:4px}
.hubf{display:grid;gap:10px;margin:12px 0}
.annee{font-family:Georgia,serif;font-size:24px;color:#4a2f2b;margin:18px 4px 2px;border-bottom:2px solid #c9a96e}.mois{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#8a5a44;margin:14px 6px 4px}.mois span{font-weight:400;color:#9a8a7a}.cel{width:100%;min-width:0;padding:6px 4px;border:1px solid #d9c9a8;border-radius:8px;font:inherit;font-size:12.5px;text-align:right;background:#fff}.hubf{display:grid;gap:10px;margin-top:10px}
.siteweb{display:block;margin:14px 0 6px;padding:14px;text-align:center;border:1.5px solid #c9a96e;border-radius:14px;background:#fff;color:#4a2f2b;font-weight:700;text-decoration:none}
button.siteweb{width:100%;font:inherit;font-weight:700;cursor:pointer}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}.cal-nav b{min-width:140px;text-align:center;font-family:Georgia,serif;font-size:18px;color:#4a2f2b}.cal{background:#fff;border:1px solid #e3d6bd;border-radius:12px;overflow:hidden;margin-bottom:12px}.cal-h{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;color:#9a8a7a;text-align:center;padding:5px 0;border-bottom:1px solid #eee3cf}.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}.cj{min-height:66px;border-right:1px solid #f0e6d3;border-bottom:1px solid #f0e6d3;padding:2px;display:flex;flex-direction:column;gap:2px;min-width:0}.cj:nth-child(7n){border-right:0}.cj.we{background:#f9f7f3}.cj.hors .nj{color:#c8bda9}.nj{align-self:flex-end;font-size:11px;color:#6b5b4b;min-width:18px;height:18px;line-height:18px;text-align:center}.nj.auj{background:#e0584b;color:#fff;border-radius:50%}.ev{display:block;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3a2a22}.ev.fil{background:#FFE08A}.ev.cli{background:#BFE3DC}.jour.cli{background:#BFE3DC!important}.jour.fil{background:#FFE08A!important}
.etat-sel{flex:none;border-radius:12px;border:1.5px solid #bbb;padding:6px 8px;font:inherit;font-size:13px;font-weight:700;min-height:40px}.etat-sel.es-p{background:#eceae6;color:#555}.etat-sel.es-c{background:#d6e6fb;color:#1c4f8c;border-color:#7fb0ea}.etat-sel.es-t{background:#d5efdc;color:#1d6a35;border-color:#7cc790}.cj .ev{white-space:normal;word-break:break-word;line-height:1.15}
button.ev{border:0;width:100%;text-align:left;font-family:inherit;cursor:pointer}
/* ---- v3 : couleurs du site, accueil plus clair ---- */
.barre{background:#FDFAF7;color:var(--brun);border-bottom:1px solid rgba(201,169,110,.55);box-shadow:0 2px 14px rgba(44,24,16,.05)}
.barre img{border:1.5px solid var(--or)}
.barre h1{font-family:Georgia,'Times New Roman',serif;color:var(--terra);font-weight:700}
.barre button{border:1.5px solid var(--terra);color:var(--terra);background:#fff}
.hdr{margin:0 0 14px}
.hdr .logo{display:block;width:92px;height:92px;margin:0 auto 12px;border-radius:50%;border:2.5px solid var(--or);box-shadow:0 4px 14px rgba(44,24,16,.12);background:#fff}
.infos{background:var(--sable);border:1.5px solid rgba(201,169,110,.6);border-radius:18px;padding:12px 14px;text-align:center}
.hdate{font-size:16px;color:var(--brun);text-transform:none}.hdate b{font-weight:700}
.hmeteo{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 0;font-size:14.5px;color:var(--gris)}
.hmeteo svg{width:22px;height:22px;flex:none;color:var(--terra)}.hmeteo .sep{opacity:.6}
.a1{background:linear-gradient(135deg,#8A432C 0%,#9E5238 45%,#C27B5B 100%)}.a2{background:linear-gradient(135deg,#A9633F 0%,#BE7A57 45%,#DDA283 100%)}.act b,.act small{text-shadow:0 1px 2px rgba(60,25,10,.35)}
a.nv{text-decoration:none}
.nvs2{margin-top:12px}
.nv.large{grid-column:1/-1;justify-content:center;min-height:68px}
.nv.large img{width:44px;height:44px;flex:none;object-fit:contain}
.nv.large .tx{display:flex;flex-direction:column;text-align:left}
.nv.large small{font-weight:400;font-size:12.5px;color:var(--gris)}
@media(max-width:380px){.nvs2{grid-template-columns:1fr}}

/* ---- v4 : ventes regroupées par marché ---- */
.vente{border:1.5px solid rgba(201,169,110,.6);border-radius:16px;overflow:hidden;margin:14px 0;background:#fff}
.vh{background:linear-gradient(135deg,#8A432C 0%,#9E5238 45%,#C27B5B 100%);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.vh b{font-family:Georgia,serif;font-size:16px}.vh small{font-size:12.5px;opacity:.95}
.vr{padding:0 10px}
.vpay{padding:10px 12px 12px;display:flex;flex-wrap:wrap;gap:8px;background:var(--sable)}
.vpay .pc{background:#fff;border:1.5px solid rgba(201,169,110,.7);border-radius:14px;padding:7px 12px;font-size:13px;color:var(--brun);line-height:1.3}
.vpay .pc b{color:var(--terra)}.vpay .pc small{display:block;color:var(--gris);font-size:11.5px}
.champs textarea{width:100%;padding:11px;border:1.5px solid rgba(201,169,110,.7);border-radius:12px;font-size:15px;background:#fff;font-family:inherit;min-height:84px}
a.petit{display:inline-block;text-decoration:none;margin-right:6px}
.petit.sec2{background:#fff;color:var(--terra);border:1.5px solid var(--terra)}
.envoi{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(201,169,110,.6)}
.envoi p{margin:0 0 4px;font-size:12.5px;color:var(--gris)}
</style>
</head>
<body>
<div id="verrou">
  <div class="carte-v">
    <img src="logo.webp" width="120" height="120" alt="Les Essences Parfumées d'Aphrodite">
    <h2>Espace administrateur</h2>
    <p class="slogan">BEAUTÉ · PARFUM · FAIT MAIN</p>
    <label for="mdp" style="font-size:14px;color:var(--gris)">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrer()">
    <button class="btn" onclick="entrer()">Entrer</button>
    <p id="msgv" role="status"></p>
  </div>
</div>

<header class="barre">
  <img src="favicon-192.png" width="34" height="34" alt="">
  <h1 id="titre">Espace administrateur</h1>
  <button id="retour" onclick="retour()" style="display:none" aria-label="Retour">← Retour</button>
</header>
<main>
  <section class="vue on" id="v-accueil">
    <div class="accueil">
      <div class="hdr"><img class="logo" src="logo.webp" width="92" height="92" alt="Les Essences Parfumées d'Aphrodite"><div class="infos"><p class="hdate" id="hdate"></p><p class="hmeteo" id="hmeteo"></p></div></div>
      <div class="nvs">

<script>
var API='https://aphrodite-relais.les-essences-parfumees-d-aphrodite.workers.dev';
var CLE='aphrodite-salon-code';
var code='';try{code=localStorage.getItem(CLE)||'';}catch(e){}
var PAGES={bon:'bon-salon.html',outil:'outil.html',fidelite:'carnet-fidelite.html'};
var PARENT={guide:'accueil',commandes:'accueil',bon:'accueil',clients:'accueil',taches:'accueil',calendrier:'accueil',anniv:'accueil',creations:'accueil',exha:'accueil',fidelite:'accueil',outil:'creations',tarifs:'creations',urssaf:'creations',filleules:'exha',finances:'exha'};
var cur='accueil';
var TITRES={guide:'Guide olfactif',tarifs:'Tarifs finitions et suppléments',urssaf:'Ventes et URSSAF',accueil:'Espace administrateur',commandes:'Commandes',bon:'Bon de commande',outil:'Calcul rapide et catalogue',fidelite:'Fidélité',creations:'Créations plâtre résine',exha:'EXHALESSENCE',clients:"Client(e)s",taches:'Mes tâches',calendrier:'Calendrier éditorial',anniv:'Anniversaires',filleules:"Filleul(e)s",finances:'Suivi financier'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function post(p,b){b=b||{};b.code=code;return fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,st:r.status,j:j};});}).catch(function(){return{ok:false,st:0,j:{erreur:'Pas de réseau.'}};});}
function memoriser(c){code=c;try{localStorage.setItem(CLE,c);localStorage.setItem('aph_adm_code',c);}catch(e){}}
var HK='aph-h';
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('aph|'+t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2);}).join('');});}
function deverrouiller(v){memoriser(v);if(window.viderFile)viderFile();document.getElementById('msgv').textContent='';document.getElementById('verrou').classList.add('cache');document.getElementById('mdp').value='';aller('accueil',true);if(window.demarrerAccueil)demarrerAccueil();}
function verrouiller(){code='';document.getElementById('verrou').classList.remove('cache');document.getElementById('mdp').value='';aller('accueil',true);}
function entrer(){
  var v=document.getElementById('mdp').value;var m=document.getElementById('msgv');
  if(!v){m.textContent='Entrez votre mot de passe.';return;}
  m.textContent='Vérification…';code=v;
  post('/salon/ping').then(function(r){
    if(r.ok){sha(v).then(function(h){try{localStorage.setItem(HK,h);}catch(e){}deverrouiller(v);});}
    else if(r.st===401){code='';m.textContent='Mot de passe incorrect.';}
    else{sha(v).then(function(h){var s='';try{s=localStorage.getItem(HK)||'';}catch(e){}if(s&&s===h)deverrouiller(v);else{code='';m.textContent=s?'Mot de passe incorrect.':'Pas de réseau : la première connexion demande du réseau.';}});}
  });
}
var absent=0;
document.addEventListener('visibilitychange',function(){if(document.hidden)absent=Date.now();else if(absent&&Date.now()-absent>10*60*1000&&code){verrouiller();}});
function retour(np){if(window.ESPACE&&ESPACE.retourInterne&&ESPACE.retourInterne(cur))return;aller(PARENT[cur]||'accueil',true);}
window.addEventListener('popstate',function(){if(cur!=='accueil')retour(true);});
function aller(v,np){
  cur=v;if(!np&&v!=='accueil'){try{history.pushState({v:v},'');}catch(e){}}
  document.querySelectorAll('.vue').forEach(function(e){e.classList.remove('on');});
  document.getElementById('v-'+v).classList.add('on');
  document.getElementById('titre').textContent=TITRES[v];
  document.getElementById('retour').style.display=v==='accueil'?'none':'';
  if(PAGES[v]){var f=document.getElementById('f-'+v);if(!f.getAttribute('src')||(v==='bon'&&!window._bonPref&&f.getAttribute('src').indexOf('?')>0))f.setAttribute('src',PAGES[v]);if(v==='bon')window._bonPref=false;}
  if(v==='commandes'){chargerCmd();}
  if(window.ESPACE&&ESPACE[v])ESPACE[v]();
  window.scrollTo(0,0);
}
/* ---- commandes ---- */
var STAT=['Reçue','En cours de création','En cours de commande','Prête','Expédiée','Terminée'];
var STX=['Nouvelle','Validée','En cours de commande','Expédiée','À récupérer','Terminée'];
var REG=['','Virement','Carte bancaire','Espèces','PayPal','Chèque','Wero','Autre'];
var all=[],msgC='',OUV={},FN={};
function typeCmd(o){
  if(o.origine==='Salon'){var mt=/Type : ([^·]+)/.exec(o.note||'');return mt?mt[1].trim():'Type à préciser';}
  if(o.src==='X'||o.origine==='EXHALESSENCE')return 'EXHALESSENCE';
  var L=String(o.produits||'').split('\n').map(function(x){return x.trim();}).filter(Boolean),e=0,c=0;
  L.forEach(function(l){var cr=/\([^)]*,[^)]*\)/.test(l)||/\b(pot|vase|bougeoir|porte[- ]bougie|plateau|vide[- ]poche|bo[iî]te|coupelle|organisateur|cr[ée]ation|hybride|sillon)\b/i.test(l);if(cr&&!/\b(P|R[ée]f\.?)\s?\d{2,3}[A-Z]?\b|\bml\b/i.test(l))c++;else e++;});
  if(c&&e)return 'Mixte';if(c)return 'Création plâtre résine';if(o.origine==='Site')return 'Création plâtre résine';return 'EXHALESSENCE';
}
function nomAff(n){n=String(n||'').trim();var t=n.split(/\s+/);if(t.length>=2&&t[0].length>1&&t[0]===t[0].toUpperCase()&&/[a-zà-ÿ]/.test(t.slice(1).join(' '))&&t[t.length-1]!==t[t.length-1].toUpperCase())return t.slice(1).join(' ')+' '+t[0];return n;}
function dfr(d){return d?d.split('-').reverse().join('/'):'';}

}

<script>
(function(){
function hor(){var d=new Date();var e=document.getElementById('hdate');if(e){var t=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});e.innerHTML='';e.appendChild(document.createTextNode(t.charAt(0).toUpperCase()+t.slice(1)+' · '));var b=document.createElement('b');b.textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});e.appendChild(b);}}
hor();setInterval(hor,20000);
var WI={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',cloud:'<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5 4.8 4.8 0 0 1 17 18z"/>',csun:'<circle cx="8" cy="8" r="2.8"/><path d="M8 2.5v1.2M2.5 8h1.2M4 4l.9.9M12 4l-.9.9"/><path d="M9 20a3.5 3.5 0 0 1-.4-7A4.8 4.8 0 0 1 18 12a4 4 0 0 1-.5 8z"/>',fog:'<path d="M4 9h16M3 13h18M6 17h12"/>',rain:'<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 5.5 4.8 4.8 0 0 1 17 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',snow:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>',storm:'<path d="M7 14a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 4.5 4.8 4.8 0 0 1 17 14z"/><path d="M12.5 14l-2.5 4h3l-2 4"/>'};

var PIN='<path d="M12 22.2C9 18.6 4.8 13.8 4.8 9.4a7.2 7.2 0 0 1 14.4 0c0 4.4-4.2 9.2-7.2 12.8z"/><circle cx="12" cy="9.4" r="2.9"/>';
var MET=function(c){return c===0?['sun','ciel dégagé']:c<=2?['csun','peu nuageux']:c===3?['cloud','nuageux']:c<=48?['fog','brouillard']:c<=57?['rain','bruine']:c<=67?['rain','pluie']:c<=77?['snow','neige']:c<=82?['rain','averses']:['storm','orage'];};
function aff(o,vieux){var e=document.getElementById('hmeteo');if(!e||!o)return;e.innerHTML='';
  function sp(c,t){var x=document.createElement('span');if(c)x.className=c;x.textContent=t;return x;}
  if(o.v){var p=document.createElement('span');p.innerHTML=sv(PIN);e.appendChild(p.firstChild);e.appendChild(sp('',o.v));e.appendChild(sp('sep','·'));}
  var w=document.createElement('span');w.innerHTML=sv(WI[o.k]||WI.cloud);e.appendChild(w.firstChild);e.appendChild(sp('',o.t+'°C · '+o.m+(vieux?' (dernière mesure)':'')));}
window.demarrerAccueil=function(){
  try{var c=JSON.parse(localStorage.getItem('aph-meteo')||'null');if(c&&c.k)aff(c,true);}catch(e){}
  if(!navigator.geolocation||!navigator.onLine)return;
  navigator.geolocation.getCurrentPosition(function(p){
    var la=p.coords.latitude,lo=p.coords.longitude;
    Promise.all([fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m,weather_code&timezone=auto').then(function(r){return r.json();}),
      fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+la+'&longitude='+lo+'&localityLanguage=fr').then(function(r){return r.json();}).catch(function(){return{};})]).then(function(x){
      var cu=x[0].current,m=MET(cu.weather_code),v=x[1].city||x[1].locality||'';
      var o={v:v,k:m[0],t:Math.round(cu.temperature_2m),m:m[1]};aff(o,false);try{localStorage.setItem('aph-meteo',JSON.stringify(o));}catch(e){}
    }).catch(function(){});
  },function(){},{timeout:8000,maximumAge:3600000});
};
})();
